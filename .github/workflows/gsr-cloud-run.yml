name: GSR Entertainment Hourly Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: gsr-entertainment-hourly-update
  cancel-in-progress: false

jobs:
  run-entertainment:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: "1"
      GSR_DISABLE_SOCIAL_POSTS: "false"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
      TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
      TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
      TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests python-dotenv tweepy feedparser
          fi

      - name: Show working directory
        run: |
          pwd
          ls -la
          find . -maxdepth 2 -type f | sort

      - name: Run Entertainment content engine
        run: |
          if [ -f content_engine.py ]; then
            python content_engine.py
          elif [ -f master_runner.py ]; then
            python master_runner.py
          else
            echo "No content_engine.py or master_runner.py found."
            exit 1
          fi

      - name: Verify generated site data
        run: |
          test -f public/latest_report.json
          python -m json.tool public/latest_report.json > /tmp/latest_report_check.json
          ls -lh public/latest_report.json
          head -40 public/latest_report.json

      - name: Stage website files
        run: |
          git add public/latest_report.json || true
          git add public/latest_report.txt || true
          git add public/global_entertainment_report.txt || true
          git add public/sitemap.xml public/robots.txt || true

      - name: Commit updated Entertainment site data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No Entertainment site-data changes to commit."
          else
            git commit -m "Auto update Global Entertainment Report data"
          fi

      - name: Push changes
        run: |
          git push origin HEAD:main