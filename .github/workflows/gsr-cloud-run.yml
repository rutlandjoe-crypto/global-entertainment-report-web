name: GSR Entertainment Hourly Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: gsr-entertainment-hourly-update
  cancel-in-progress: false

jobs:
  run-entertainment:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: "1"
      GSR_DISABLE_SOCIAL_POSTS: "false"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
      TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
      TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
      TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
      GSR_PUSH_TOKEN: ${{ secrets.GSR_PUSH_TOKEN }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Sync with latest master
        run: |
          git pull --rebase origin master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests python-dotenv tweepy feedparser
          fi

      - name: Show working directory
        run: |
          pwd
          ls -la
          find . -maxdepth 2 -type f | sort

      - name: Run Entertainment content engine
        run: |
          echo "ENTERTAINMENT BLOCK START"
          python master_runner.py
          echo "ENTERTAINMENT BLOCK FINISH"

      - name: Verify generated site data
        run: |
          test -f public/latest_report.json
          python -m json.tool public/latest_report.json > /tmp/latest_report_check.json
          python - <<'PY'
          import json
          data = json.load(open("public/latest_report.json", encoding="utf-8"))
          accepted = int(data.get("freshness", {}).get("accepted_real_items") or 0)
          print("accepted_real_items=", accepted)
          print("homepage_cards=", len(data.get("homepage_cards") or []))
          print("live_newsroom=", len(data.get("live_newsroom") or []))
          if accepted <= 0:
              raise SystemExit("No real RSS items were accepted")
          PY
          ls -lh public/latest_report.json
          head -40 public/latest_report.json

      - name: Publish latest report to production blob
        run: |
          if [ -z "${GSR_PUSH_TOKEN:-}" ]; then
            echo "GSR_PUSH_TOKEN is not configured; skipping production blob publish."
            exit 0
          fi

          curl --fail --show-error --silent \
            --request POST \
            --header "Authorization: Bearer ${GSR_PUSH_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @public/latest_report.json \
            "https://globalentertainmentreport.com/api/push-report"

      - name: Stage website files
        run: |
          git add public/latest_report.json public/latest_report.txt latest_report.json latest_report.txt entertainment_report.txt || true

      - name: Guard Entertainment report quality before commit
        run: python scripts/check_entertainment_agent.py
      - name: Commit updated Entertainment site data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No Entertainment site-data changes to commit."
          else
            git commit -m "Auto update Entertainment site data"
          fi
      - name: Push changes
        run: |
          if git diff --cached --quiet && git diff --quiet; then
            echo "Nothing to push."
          else
            git pull --rebase --autostash origin master
            git push origin HEAD:master
          fi

